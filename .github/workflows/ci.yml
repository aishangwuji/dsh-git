name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 插件运行时没有任何 npm 依赖（只用 Node 内置模块），所以不需要 install。
      - name: host, client and invariant tests
        run: node --test test/host.test.mjs test/client.test.mjs test/invariants.test.mjs
      - name: render checks
        run: |
          node scripts/ssr-check.mjs
          node scripts/panel-render-check.mjs
      - name: syntax check
        run: |
          node --check index.js
          node --check client.js
